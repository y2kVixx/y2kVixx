name: Atualizar heatmap de anime/mangá

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC (~03:00 no horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar heatmap.svg
        env:
          ANILIST_USERNAME: ASKKAAA
        run: python scripts/generate_heatmap.py

      - name: Commitar heatmap atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/heatmap.svg
          git diff --staged --quiet || git commit -m "chore: atualiza heatmap de atividade"
          git push
